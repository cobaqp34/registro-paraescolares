  <script>
    (function() {
      function aplicarModoMovil() {
        const esNavegadorMovil = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
        const ancho = Math.min(window.innerWidth || 9999, window.screen.width || 9999);
        const esMovil = esNavegadorMovil || ancho <= 1100;
        document.documentElement.classList.toggle('mobile-device', esMovil);
        if (document.body) {
          document.body.classList.toggle('force-mobile', esMovil);
        }
      }

      aplicarModoMovil();
      document.addEventListener('DOMContentLoaded', aplicarModoMovil);
      window.addEventListener('resize', aplicarModoMovil);
      window.addEventListener('orientationchange', aplicarModoMovil);
    })();
  </script>

<body>
  <div class="page-shell">
  <main class="container">
    <h1>Registro a Talleres Paraescolares Semestre 2026-B</h1>
    <p class="description">Ingresa tu matricula para consultar tus datos y elegir un taller disponible.</p>

    <label for="idInput">Matricula</label>

    <div class="search-row">
      <input
        id="idInput"
        type="text"
        maxlength="30"
        autocomplete="off"
        placeholder="Ej. 263410012"
        onkeydown="if(event.key === 'Enter') consultar();"
      >
      <button id="btnConsultar" onclick="consultar()">Consultar</button>
    </div>

    <div id="status"></div>

    <section id="results" class="results hidden">
      <h2>Datos del alumno</h2>
      <div id="dataContainer" class="student-grid"></div>
    </section>

    <section id="registration" class="registration hidden">
      <h2>Talleres disponibles</h2>
      <div id="registeredNotice"></div>
      <div id="workshopList" class="workshop-list"></div>

      <div id="registerControls" class="form-row">
        <button id="btnRegistrar" class="secondary-button" onclick="registrar()" disabled>
          Registrarme
        </button>
      </div>
    </section>
  </main>
  </div>

  <script>
    let alumnoActual = null;
    let talleresActuales = [];
    let registroActual = null;
    let registrosActuales = [];
    let permiteDobleRegistro = false;
    let puedeRegistrarMas = true;

    // URL de la Web App de Apps Script que funciona como backend/API.
    const API_URL = 'https://script.google.com/macros/s/AKfycbyM1h54RdRc-73C4s6jz_4WmRSmlC6wuc10046BxCeiZD9F1pbZ_aLKDpMU5YeHEZvZ/exec';
    let jsonpCounter = 0;

    function llamarApi(action, params, onSuccess, onError) {
      const callbackName = `__apiCallback_${Date.now()}_${jsonpCounter++}`;
      const script = document.createElement('script');
      const query = new URLSearchParams({
        action: action,
        callback: callbackName,
        ...params
      });

      let terminado = false;

      function limpiar() {
        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }
        try {
          delete window[callbackName];
        } catch (e) {
          window[callbackName] = undefined;
        }
      }

      window[callbackName] = function(response) {
        if (terminado) return;
        terminado = true;
        limpiar();
        onSuccess(response);
      };

      script.onerror = function(error) {
        if (terminado) return;
        terminado = true;
        limpiar();
        if (onError) onError(error);
      };

      script.src = `${API_URL}?${query.toString()}`;
      script.async = true;
      document.head.appendChild(script);
    }


    function consultar() {
      const input = document.getElementById('idInput');
      const id = input.value.trim();

      limpiarResultado();

      if (!id) {
        mostrarMensaje('Escribe una matricula.', 'error');
        input.focus();
        return;
      }

      setLoading('btnConsultar', true, 'Consultando');

      llamarApi(
        'consultar',
        { id: id },
        function(response) {
          procesarRespuesta(response);
        },
        function(error) {
          setLoading('btnConsultar', false, 'Consultar');
          mostrarMensaje('Ocurrio un error al comunicarse con la aplicacion.', 'error');
          console.error(error);
        }
      );
    }

    function procesarRespuesta(response) {
      setLoading('btnConsultar', false, 'Consultar');

      if (!response || !response.ok) {
        mostrarMensaje(response?.message || 'No fue posible realizar la consulta.', 'error');
        return;
      }

      if (!response.encontrado) {
        mostrarMensaje(response.message || 'No se encontro informacion.', 'info');
        return;
      }

      alumnoActual = response.student;
      talleresActuales = response.talleres || [];
      registroActual = response.registro || null;
      registrosActuales = response.registros || (registroActual ? [registroActual] : []);
      const matriculaConsultada = String(alumnoActual?.matricula || '').trim();
      const esEscoltaYPaz = [
        '263410058', '263410046', '263410040',
        '263410036', '263410044', '263410057'
      ].includes(matriculaConsultada);

      permiteDobleRegistro = Boolean(response.permiteDobleRegistro) || esEscoltaYPaz;
      puedeRegistrarMas = permiteDobleRegistro
        ? registrosActuales.length < 2
        : response.puedeRegistrarMas !== false;

      mostrarDatos(response.data);
      mostrarTalleres();
    }

    function mostrarDatos(data) {
      const container = document.getElementById('dataContainer');
      container.innerHTML = '';

      Object.entries(data).forEach(([campo, valor]) => {
        const row = document.createElement('div');
        row.className = 'field';

        const name = document.createElement('div');
        name.className = 'field-name';
        name.textContent = formatearNombreCampo(campo);

        const value = document.createElement('div');
        value.className = 'field-value';
        value.textContent = valor || '-';

        row.appendChild(name);
        row.appendChild(value);
        container.appendChild(row);
      });

      document.getElementById('results').classList.remove('hidden');
      document.getElementById('status').innerHTML = '';
    }

    function mostrarTalleres() {
      const section = document.getElementById('registration');
      const notice = document.getElementById('registeredNotice');
      const list = document.getElementById('workshopList');
      const controls = document.getElementById('registerControls');

      section.classList.remove('hidden');
      notice.innerHTML = '';
      list.innerHTML = '';

      if (registrosActuales.length) {
        const detalle = registrosActuales
          .map(reg => `${escapeHtml(reg.taller)} (${escapeHtml(reg.dia)} ${escapeHtml(reg.horario)})`)
          .join('<br>');

        notice.innerHTML = `
          <div class="message success">
            ${registrosActuales.length === 1 ? 'Ya tienes registro en:' : 'Ya tienes registros en:'}<br>
            ${detalle}
          </div>
        `;
      }

      if (!puedeRegistrarMas) {
        controls.classList.add('hidden');
        validarSeleccion();
        return;
      }

      controls.classList.remove('hidden');

      const talleresDisponibles = talleresActuales.filter(
        taller => taller.eligible && !taller.yaRegistrado
      );

      if (!talleresDisponibles.length) {
        list.innerHTML = `
          <div class="message info">
            No hay talleres adicionales disponibles para tu registro.
          </div>
        `;
        controls.classList.add('hidden');
        validarSeleccion();
        return;
      }

      if (!alumnoActual.genero) {
        list.innerHTML = `
          <div class="message error">
            Acude a control escolar para completar tu genero.
          </div>
        `;
        controls.classList.add('hidden');
        validarSeleccion();
        return;
      }

      talleresDisponibles.forEach(taller => {
        const disabledByCapacity = !tallerTieneCupoParaGenero(taller);
        const item = document.createElement('label');
        item.className = `workshop-option ${disabledByCapacity ? 'disabled' : ''}`;

        const control = document.createElement('input');
        const esAlumnoDoble = permiteDobleRegistro;
        control.type = esAlumnoDoble ? 'checkbox' : 'radio';
        control.name = 'taller';
        control.value = taller.id;
        control.disabled = disabledByCapacity;
        control.onchange = validarSeleccion;

        const content = document.createElement('div');
        const title = document.createElement('div');
        title.className = 'workshop-title';
        title.textContent = taller.name;

        if (taller.mandatory) {
          const badge = document.createElement('span');
          badge.className = 'badge';
          badge.textContent = 'Obligatorio';
          title.appendChild(badge);
        }

        const meta = document.createElement('div');
        meta.className = 'workshop-meta';
        meta.textContent = `${taller.day} ${taller.time} | Cupo: ${taller.cupo} | Disponible: ${taller.lugaresDisponibles}`;

        content.appendChild(title);
        content.appendChild(meta);

        if (disabledByCapacity) {
          const reason = document.createElement('div');
          reason.className = 'workshop-reason';
          reason.textContent = obtenerMensajeCupoLleno(taller);
          content.appendChild(reason);
        }

        item.appendChild(control);
        item.appendChild(content);
        list.appendChild(item);
      });

      validarSeleccion();
    }

    function registrar() {
      const seleccionados = obtenerTalleresSeleccionados();

      if (!alumnoActual || !seleccionados.length) {
        mostrarMensaje('Selecciona al menos un taller disponible.', 'error');
        return;
      }

      if (!permiteDobleRegistro && seleccionados.length > 1) {
        mostrarMensaje('Solo puedes seleccionar un taller.', 'error');
        return;
      }

      if (permiteDobleRegistro && seleccionados.length > 2) {
        mostrarMensaje('Solo puedes seleccionar hasta dos talleres.', 'error');
        return;
      }

      for (const taller of seleccionados) {
        if (!tallerTieneCupoParaGenero(taller) || !obtenerGeneroParaRegistro(taller)) {
          mostrarMensaje('Uno de los talleres seleccionados ya no tiene cupo disponible.', 'error');
          return;
        }
      }

      setLoading('btnRegistrar', true, 'Registrando');
      registrarSeleccionadosSecuencialmente(seleccionados, 0, []);
    }

    function registrarSeleccionadosSecuencialmente(seleccionados, indice, registrosNuevos) {
      if (indice >= seleccionados.length) {
        setLoading('btnRegistrar', false, 'Registrarme');
        mostrarMensaje(
          seleccionados.length === 1
            ? 'Registro realizado correctamente.'
            : 'Los dos registros se realizaron correctamente.',
          'success'
        );
        mostrarTalleres();
        return;
      }

      const selected = seleccionados[indice];

      llamarApi(
        'registrar',
        {
          matricula: alumnoActual.matricula,
          tallerId: selected.id
        },
        function(response) {
          if (!response || !response.ok) {
            setLoading('btnRegistrar', false, 'Registrarme');
            mostrarMensaje(
              response?.message ||
                (registrosNuevos.length
                  ? 'El primer registro se realizó, pero no fue posible completar el segundo.'
                  : 'No fue posible guardar el registro.'),
              'error'
            );
            // Refrescar la información para que el usuario vea exactamente qué quedó registrado.
            consultarDespuesDeRegistro();
            return;
          }

          registroActual = response.registro || null;

          if (response.registros) {
            registrosActuales = response.registros;
          } else if (response.registro) {
            registrosActuales = registrosActuales.concat([response.registro]);
          }

          const tallerLocal = talleresActuales.find(t => t.id === selected.id);
          if (tallerLocal) {
            tallerLocal.yaRegistrado = true;
            tallerLocal.selectable = false;
          }

          registrosNuevos.push(response.registro || selected);
          registrarSeleccionadosSecuencialmente(seleccionados, indice + 1, registrosNuevos);
        },
        function(error) {
          setLoading('btnRegistrar', false, 'Registrarme');
          mostrarMensaje(
            registrosNuevos.length
              ? 'El primer registro se realizó, pero ocurrió un error al completar el segundo.'
              : 'Ocurrió un error al guardar el registro.',
            'error'
          );
          console.error(error);
          consultarDespuesDeRegistro();
        }
      );
    }

    function consultarDespuesDeRegistro() {
      if (!alumnoActual?.matricula) return;
      const id = String(alumnoActual.matricula).trim();
      llamarApi(
        'consultar',
        { id: id },
        function(response) {
          if (response && response.ok && response.encontrado) {
            procesarRespuesta(response);
          }
        },
        function(error) {
          console.error(error);
        }
      );
    }

    function validarSeleccion() {
      const seleccionados = obtenerTalleresSeleccionados();
      const button = document.getElementById('btnRegistrar');

      if (!puedeRegistrarMas || !seleccionados.length) {
        button.disabled = true;
        return;
      }

      if (!permiteDobleRegistro && seleccionados.length > 1) {
        button.disabled = true;
        return;
      }

      if (permiteDobleRegistro && seleccionados.length > 2) {
        button.disabled = true;
        return;
      }

      const todosValidos = seleccionados.every(taller =>
        tallerTieneCupoParaGenero(taller) && Boolean(obtenerGeneroParaRegistro(taller))
      );

      button.disabled = !todosValidos;
    }

    function tallerTieneCupoParaGenero(taller) {
      if (taller.lugaresDisponibles === 'Ilimitado') {
        return true;
      }

      if (!taller.requiresGender || !taller.disponibilidadPorGenero) {
        return taller.cupoDisponible;
      }

      return Number(taller.disponibilidadPorGenero[alumnoActual.genero] || 0) > 0;
    }

    function obtenerMensajeCupoLleno(taller) {
      if (taller.quotaType !== 'gender') {
        return 'Cupo lleno';
      }

      return alumnoActual.genero === 'HOMBRE'
        ? 'Sin cupo disponible para hombres.'
        : 'Sin cupo disponible para mujeres.';
    }

    function obtenerTalleresSeleccionados() {
      return Array.from(document.querySelectorAll('input[name="taller"]:checked'))
        .map(input => talleresActuales.find(taller => taller.id === input.value))
        .filter(Boolean);
    }

    function obtenerTallerSeleccionado() {
      return obtenerTalleresSeleccionados()[0] || null;
    }

    function obtenerGeneroParaRegistro(taller) {
      return alumnoActual.genero || '';
    }

    function mostrarMensaje(texto, tipo) {
      document.getElementById('status').innerHTML =
        `<div class="message ${tipo}">${escapeHtml(texto)}</div>`;
    }

    function limpiarResultado() {
      alumnoActual = null;
      talleresActuales = [];
      registroActual = null;
      registrosActuales = [];
      permiteDobleRegistro = false;
      puedeRegistrarMas = true;
      document.getElementById('status').innerHTML = '';
      document.getElementById('results').classList.add('hidden');
      document.getElementById('registration').classList.add('hidden');
      document.getElementById('registerControls').classList.remove('hidden');
      document.getElementById('dataContainer').innerHTML = '';
      document.getElementById('workshopList').innerHTML = '';
      document.getElementById('registeredNotice').innerHTML = '';
    }

    function setLoading(buttonId, loading, text) {
      const button = document.getElementById(buttonId);

      button.disabled = loading;
      button.innerHTML = loading
        ? `<span class="spinner"></span>${escapeHtml(text)}`
        : escapeHtml(text);
    }

    function formatearNombreCampo(campo) {
      return campo
        .toLowerCase()
        .replace(/_/g, ' ')
        .replace(/\b\w/g, letra => letra.toUpperCase());
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text == null ? '' : text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
